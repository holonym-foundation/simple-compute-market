name: Storefront CI

on:
  pull_request:
    paths:
      - "storefront/**"
      - "service/**"
      - "policy/**"
      - "provisioning-service/**"
      - "storefront-client/**"
      - "registry-client/**"
      - ".github/workflows/storefront-ci.yml"
  push:
    paths:
      - "storefront/**"
      - "service/**"
      - "policy/**"
      - "provisioning-service/**"
      - "storefront-client/**"
      - "registry-client/**"
      - ".github/workflows/storefront-ci.yml"

permissions:
  contents: read

concurrency:
  group: storefront-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.13"
          enable-cache: true
          cache-dependency-glob: storefront/uv.lock

      - name: Build internal dependency wheels
        run: make dist-service dist-policy dist-provisioning dist-storefront-client dist-registry

      - name: Install locked storefront environment
        working-directory: storefront
        run: uv sync --locked --extra lint --find-links ../.dist

      - name: Lint inert storefront boundary
        working-directory: storefront
        run: |
          uv run ruff check \
            src/market_storefront/agent.py \
            src/market_storefront/server.py \
            src/market_storefront/services/system_service.py \
            tests/unit/test_inert_activation_mode.py \
            tests/unit/test_storefront_image_contract.py

      - name: Test storefront
        working-directory: storefront
        run: uv run pytest tests/unit tests/integration -q

      - name: Build and inspect inert storefront artifact
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --target inert-runtime \
            --tag scm-storefront-inert:${GITHUB_SHA} \
            --file storefront/Dockerfile \
            .
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=1777 \
            --env HOME=/tmp \
            --entrypoint /bin/sh \
            scm-storefront-inert:${GITHUB_SHA} \
            -ceu 'test "$STOREFRONT_ACTIVATION_MODE" = inert; ! command -v sudo; ! command -v zerotier-one; ! command -v zerotier-cli; python3 -c "from market_storefront.utils.config import ACTIVATION_MODE; assert ACTIVATION_MODE == '\''inert'\''"'
