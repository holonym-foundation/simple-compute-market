---
# container-management role — defaults for AEX-native container tenants.
# Mirrors vm-management but provisions Docker containers (no nested-virt needed),
# so it runs on plain cloud hosts (e.g. aex-native-scm). See compute-provisioning-iac
# README "Docker Application Deployment" for the underlying primitives.

container_runtime: docker

# Default tenant image (override per-listing via `container_image`). The AEX agent
# base image (recipe runtime) is published to a registry the provider can pull.
container_default_image: "ghcr.io/holonym-foundation/aex-agent-base:latest"

# Resource caps — fair-share + blast-radius. One tenant cannot starve the host.
container_default_memory: "512m"
container_default_cpus: "1.0"
container_default_pids_limit: 256

container_restart_policy: "unless-stopped"
container_network_mode: "bridge"

# The per-tenant $HOME holds the WaaP credential. It is mounted from a per-tenant
# NAMED VOLUME that only this container mounts — so a sibling container can never
# read it. This is the cross-tenant isolation guarantee (replaces the SEV-HIGH
# shared-user model on the legacy box).
container_home_path: "/home/agent/.home"

# Hardening defaults. The tenant terminal is an interactive shell, so each
# container is treated as hostile: the goal is maximal freedom INSIDE the
# sandbox, hard walls AROUND it (other tenants, the host, AEX keys).
#
# NOTE — daemon-level controls that complete this model are NOT settable per
# container and MUST be configured on the host (see HARDENING.md): docker
# `userns-remap` (so container-root != host-root — the primary defense against a
# container escape reading another tenant's home volume on disk), the default
# seccomp + AppArmor profiles (do not disable), `DOCKER-USER` egress
# rate-limit/monitoring, and a per-tenant disk quota.
container_read_only_rootfs: true            # immutable rootfs; writable state -> home volume + tmpfs
container_no_new_privileges: true
# Run as a fixed non-root UID:GID. With userns-remap this maps to an
# unprivileged (and per-tenant-distinct) host UID, so even root-in-container
# cannot read a sibling's home volume off the host. Agent base images MUST ship
# this user and own container_home_path.
container_user: "10001:10001"
# Drop ALL Linux capabilities, add back only what an agent legitimately needs
# (none by default). Blocks the bulk of escape / host-tamper vectors.
container_cap_drop: ["ALL"]
container_cap_add: []
# Writable ephemeral paths when the rootfs is read-only. Tenant PERSISTENT state
# (keys, KB, data, config) belongs in the home volume, never tmpfs.
container_tmpfs: ["/tmp", "/run"]

# Teardown: destroy removes the home volume; lease_end keeps it (resume/reclaim).
container_remove_volume: true

# Archive (cold storage) — when a lease ends unpaid (after grace), export the home
# volume to S3-compatible object storage so the tenant can be RESTORED later, then
# free the node. We archive STATE (the volume), never the container or an image.
# Recommended endpoint: Hetzner Object Storage (same region; R2/B2/GCS also work).
archive_workdir: "/var/lib/aex/archive"
archive_s3_endpoint: ""                  # e.g. https://fsn1.your-objectstorage.com
archive_s3_bucket: "aex-tenant-archives"
archive_prefix: "tenants"
# Client-side encryption (the volume holds a WaaP share). Set to enable `age`
# encryption; key managed in TAP. Bucket SSE is the at-rest baseline when unset.
archive_age_recipient: ""                # age public key (archive side)
archive_age_identity: ""                 # age private key path (restore side)
